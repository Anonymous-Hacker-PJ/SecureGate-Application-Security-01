<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SecureGate | Application Security PBL</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f3f5f9;color:#172033;font:16px Arial,sans-serif}
header{background:#111827;color:white;padding:20px 7%;display:flex;justify-content:space-between;align-items:center}
header a{color:#fff;text-decoration:none;margin-left:18px}.brand{font-weight:700;letter-spacing:1px}
main{max-width:760px;margin:48px auto;padding:0 20px}.panel{background:white;padding:32px;border-radius:14px;box-shadow:0 8px 30px #10182812}
h1{margin-top:0;color:#111827}p{line-height:1.6;color:#536078}label{display:block;margin:16px 0 6px;font-weight:600}
input{width:100%;padding:12px;border:1px solid #cbd2df;border-radius:7px;font-size:16px}
button,.btn{display:inline-block;background:#1d4ed8;color:white;border:0;border-radius:7px;padding:12px 18px;margin-top:18px;text-decoration:none;cursor:pointer}
.msg{padding:12px;border-radius:7px;background:#eef2ff;margin:12px 0}.error{background:#fee2e2}.success{background:#dcfce7}
footer{text-align:center;color:#718096;margin:40px}code{background:#eef2f7;padding:2px 5px;border-radius:4px}
</style></head><body><header><span class="brand">SECUREGATE</span><nav><a href="/">Home</a><a href="/register">Register</a><a href="/login">Login</a></nav></header>
<main>{% with messages = get_flashed_messages(with_categories=true) %}{% for category,message in messages %}<div class="msg {{category}}">{{message}}</div>{% endfor %}{% endwith %}{% block content %}{% endblock %}</main>
<footer>Application Security Project • Secure authentication demo</footer></body></html>
